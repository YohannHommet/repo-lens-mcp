name: CI - Quality & Tests

on:
  push:
    branches-ignore: [main] # Main is handled by CD workflow to avoid double runs, OR keep it to see green checks everywhere.
    # Let's keep it simple: run on all pushes to ensure feedback loop.
  pull_request:
    branches: [main]

jobs:
  validate:
    name: 🛡️ Validate & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🏗️ Build Check
        run: npm run build

      - name: 🧪 Unit Tests
        run: npm test
