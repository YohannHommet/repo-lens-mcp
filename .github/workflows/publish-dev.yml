name: Publish Dev Version

on:
  push:
    branches:
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Version and Publish (Dev)
        run: |
          # Get base version from package.json
          BASE_VERSION=$(node -p "require('./package.json').version")
          
          # Generate dev version: 1.0.0-dev.TIMESTAMP.COMMIT_SHORT
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          DEV_VERSION="$BASE_VERSION-dev.$TIMESTAMP.$COMMIT_SHORT"
          
          echo "🚀 Publishing version: $DEV_VERSION"
          
          # Update version in package.json (no git tag needed)
          npm version $DEV_VERSION --no-git-tag-version --force
          
          # Publish to NPM with 'next' tag
          npm publish --tag next --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
