name: CD - Main Branch Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-canary:
    name: 🚀 Deploy Canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: 🛡️ Verify Quality
        run: |
          npm run lint
          npm test

      - name: 🏗️ Build
        run: npm run build

      - name: 📦 Publish Canary (@next)
        run: |
          # Create version like 1.0.0-next.TIMESTAMP-COMMIT
          BASE_VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          CANARY_VERSION="$BASE_VERSION-next.$TIMESTAMP.$COMMIT_SHORT"

          echo "Publishing $CANARY_VERSION"

          npm version $CANARY_VERSION --no-git-tag-version
          npm publish --tag next --access public --provenance
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
